name: daily-collect

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect weather snapshot (Open-Meteo, no key)
        run: python scripts/collect_weather.py
      - name: Commit results
        run: |
          git config user.name "muse-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: daily weather snapshot $(date -u +%F)"
            git push
          fi
